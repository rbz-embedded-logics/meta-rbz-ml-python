BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rbz-ml-python"
BBFILE_PATTERN_rbz-ml-python = "^${LAYERDIR}/"
BBFILE_PRIORITY_rbz-ml-python = "60"
LAYERVERSION_rbz-ml-python = "1"
LAYERSERIES_COMPAT_rbz-ml-python = "wrynose"
LAYERDEPENDS_rbz-ml-python = "rbz meta-python-ai qt6-layer"

# python3-scipy needs Fortran (target and host, it also builds python3-scipy-native)
FORTRAN:forcevariable = ",fortran"
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
HOSTTOOLS += "gfortran"

# meta-qt6 6.11.0 does not define it; clang is in oe-core since whinlatter
CAN_USE_PYSIDE6 = "1"
